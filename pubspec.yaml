name: drews_pdf_studio
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.3.3
  pdfrx: ^2.4.7
  pdf_manipulator: ^6.0.0
  easy_localization: ^3.0.8
  country_flags: ^4.1.2
  shared_preferences: ^2.5.3
  image: ^4.5.4
  crypto: ^3.0.6
  path: ^1.9.1
  dio: ^5.9.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7
  flutter_colorpicker: ^1.1.0
  reorderable_grid_view: ^2.2.8
  drews_desktop_menu: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  pdfrx_engine:
    path: packages/pdfrx

flutter_launcher_icons:
  android: false
  ios: false
  web:
    generate: false
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  linux:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/docs/
    - assets/translations/
    - assets/images/
